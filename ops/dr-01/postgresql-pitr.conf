# Install as a PostgreSQL conf.d fragment only after pgBackRest stanza creation
# and `sudo -u postgres pgbackrest --stanza=data-statistics check` succeed.
wal_level = replica
archive_mode = on
archive_command = '/usr/bin/pgbackrest --stanza=data-statistics archive-push %p'

# Bounds quiet-database RPO without producing a WAL segment every few seconds.
archive_timeout = 300s

# Used by restored clusters. Normal primary operation does not call it.
restore_command = '/usr/bin/pgbackrest --stanza=data-statistics archive-get %f "%p"'
