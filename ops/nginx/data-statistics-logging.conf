# Install inside the nginx http {} context, then use `access_log ... privacy_main`.
# The normalized path variable never contains the query string. Client IP,
# authenticated username, Referer, and User-Agent are intentionally omitted because
# they are personal or fingerprinting data and are not required for diagnostics.
log_format privacy_main escape=json
                        '{"timestamp":"$time_iso8601",'
                        '"requestId":"$request_id",'
                        '"method":"$request_method",'
                        '"path":"$uri",'
                        '"protocol":"$server_protocol",'
                        '"status":$status,'
                        '"bytesSent":$body_bytes_sent,'
                        '"requestTime":$request_time}';

# The application explicitly audits every authenticated 403 with its actor. This
# anonymous fallback is reserved for Nginx-owned or otherwise actorless 403s.
# App-audited responses carry an internal marker, which is stripped before the
# response reaches the client to prevent duplicates.
map "$status:$upstream_http_x_security_audit" $log_authorization_denied {
    default 0;
    "403:" 1;
}

log_format privacy_authorization_denied escape=json
                        '{"timestamp":"$time_iso8601",'
                        '"category":"security",'
                        '"event":"AUTHORIZATION_DENIED",'
                        '"userId":null,'
                        '"teamId":null,'
                        '"result":"denied"}';

access_log /var/log/nginx/access.log privacy_main;
access_log /var/log/nginx/security.log privacy_authorization_denied if=$log_authorization_denied;
proxy_hide_header X-Security-Audit;
server_tokens off;
