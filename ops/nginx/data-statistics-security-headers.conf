# Include this file in both the HTTPS application server block and any
# internally generated error response server block.
#
# CSP is deliberately report-only for the first rollout. Review browser and
# reporting output before moving the same policy to Content-Security-Policy.

server_tokens off;
proxy_hide_header X-Powered-By;

add_header Strict-Transport-Security "max-age=604800" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
