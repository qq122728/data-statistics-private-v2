# Keep existing bookmarks and tabs usable after the old monolith UI is
# replaced. The frontline root reads /api/auth/me and sends management users
# to /admin, so this redirect does not need to guess the account's role.
location ~ ^/(?:anomaly-ranking|attendance|batch-tracking|channel-analysis|company-organization|customer-conversion|customer-follow-up|customer-timeline|dashboard|device-accounts|entry|expert-customers|finance-reports|group-customers|group-daily-detail|history|management-rankings|notifications|performance-leaderboard|personal-data|personnel|resource-channels|resource-conversion|resource-invalid-data|role-rankings|team-members|team-performance)(?:/.*)?$ {
    return 307 /;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
