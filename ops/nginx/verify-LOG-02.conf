pid nginx.pid;
error_log stderr;

events {}

http {
    include data-statistics-logging.conf;
    server {
        listen 127.0.0.1:18080;
        auth_basic "LOG-02 privacy test";
        auth_basic_user_file verify-LOG-02.htpasswd;
        location / { proxy_pass http://127.0.0.1:18081; }
    }
}
