# PostgreSQL security visibility without logging SQL bind parameters or all SQL.
# Apply through the distribution's conf.d include mechanism and reload PostgreSQL.
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_statement = 'none'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_hostname = off
log_line_prefix = '%m [%p] db=%d,user=%u,app=%a '
