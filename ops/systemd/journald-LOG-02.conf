# Install as /etc/systemd/journald.conf.d/60-data-statistics-retention.conf.
# These are host-wide safety limits, so confirm 1G/2G are appropriate for the
# server before deployment. RuntimeMaxUse also covers hosts without /var/log/journal.
[Journal]
SystemMaxUse=1G
RuntimeMaxUse=1G
SystemKeepFree=2G
RuntimeKeepFree=2G
MaxRetentionSec=14day
MaxFileSec=1day
Compress=yes
